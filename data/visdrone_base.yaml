# Ultralytics YOLO 🚀 - Dataset config: VisDrone (BASE, sin preprocesamiento adicional)
# Dataset base: dataset VisDrone convertido a formato YOLO, clase única "person".
# Los aumentos on-the-fly (mosaic, mixup, fliplr, hsv, etc.) se aplican en tiempo de
# entrenamiento vía los hiperparámetros por defecto de ultralytics/cfg/default.yaml,
# NO se tocan aquí.
#
# 'path' es absoluta, así que ultralytics la usa tal cual (no se resuelve contra
# datasets_dir). Ver README_EXPERIMENTS.md, sección "Estructura de directorios".

path: C:/Users/pedroam/Documents/Data-Augmentation/Datasets-Clean/VisDrone # raíz del dataset
train: train/images # imágenes de entrenamiento (relativas a 'path')
val: validation/images # imágenes de validación (relativas a 'path')
test: # opcional

# Classes
nc: 1
names:
  0: person
